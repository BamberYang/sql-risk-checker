# SQL 上线风险静态检查工具 —— 内置默认配置
# 格式：Java Properties（Java 8 Properties.load，UTF-8 字符流读取；v1.11 起替代原 yaml）
# 合并规则：本文件 < 用户配置（--config，同键覆盖）< CLI 参数（--db-url/--db-username/--db-password/--dialect）。
# 键值分隔符 = 或 : 均可；注释必须独占一行（行首 # 或 !，行内 # 会并入值）；
# 值可含空格与 = 号（无需引号，写引号会原样保留）。
# 注意：保守策略固定启用、不可关闭，无对应配置开关。
# 已移除配置项（出现时告警忽略）：bulk_operation_threshold、conservative_if_always_false、metadata_file。

# 规则级别与开关（ruleId 属于规则集 H1~H3 / M1~M6、M8 / L1、L2、L4）
# 键形如 rules.<ruleId>.level / rules.<ruleId>.enabled；缺 level 时用户配置继承本文件取值。
rules.H1.level=HIGH
rules.H1.enabled=true
rules.H2.level=HIGH
rules.H2.enabled=true
rules.H3.level=HIGH
rules.H3.enabled=true
rules.M1.level=MEDIUM
rules.M1.enabled=true
rules.M2.level=MEDIUM
rules.M2.enabled=true
rules.M3.level=MEDIUM
rules.M3.enabled=true
rules.M4.level=MEDIUM
rules.M4.enabled=true
rules.M5.level=MEDIUM
rules.M5.enabled=true
rules.M6.level=MEDIUM
rules.M6.enabled=true
rules.M8.level=MEDIUM
rules.M8.enabled=true
rules.L1.level=LOW
rules.L1.enabled=true
rules.L2.level=LOW
rules.L2.enabled=true
rules.L4.level=LOW
rules.L4.enabled=true

# 数据库连接（元数据来源，FR-8）：启动时经 JDBC 读取一次、只读、加载后即关闭。
# 密码优先级：--db-password > 环境变量 SQL_RISK_DB_PASSWORD > 本键（建议用前两者，避免明文落盘）。
# datasource.url 为必需项：未配置将报错退出（exit 2）。
datasource.url=
datasource.username=
datasource.password=
datasource.connection_timeout_seconds=10

# SQL 方言（v1.8/D25；v1.10 起内置 mysql/postgresql）：oracle 为预留值，配置将报错。
dialect=mysql

# 低危不推荐写法关键字表（L1 规则；大小写不敏感、空白折叠后匹配）。
# 下标键从 0 起、可稀疏，按下标升序取值；单值键 low_risk_keywords= 表示整体替换为空表。
low_risk_keywords.0=SELECT *
low_risk_keywords.1=OR 1=1

# 白名单：仅支持完整匹配 与 namespace.* 前缀匹配（Lambda 类语句不参与校验）。
# 逐条追加用下标键 whitelist.statements.<n>=<pattern>；本行为空值 = 空白名单（整体替换）。
# 单值键与下标键不可混用（混用直接报错）。
whitelist.statements=
